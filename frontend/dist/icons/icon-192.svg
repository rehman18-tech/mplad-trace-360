<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <!-- Background Gradient: Deep Royal Indigo to Midnight Navy -->
    <linearGradient id="pwaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2B48" />
      <stop offset="50%" stop-color="#0A1D33" />
      <stop offset="100%" stop-color="#05101D" />
    </linearGradient>

    <!-- Golden Saffron Glow Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Cyan Satellite Glow -->
    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Subtle Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Full Background (Safe for Maskable Crop) -->
  <rect width="192" height="192" fill="url(#pwaBg)" />

  <!-- Center Artwork - Strictly Inside 65% Safe-Zone to Prevent Android Mask Cut-Off -->
  <g transform="translate(96, 96)" filter="url(#glow)">
    
    <!-- Outer 360 Radar Orbit Rings -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-dasharray="8 6" opacity="0.45" />
    <circle cx="0" cy="0" r="40" fill="#0D2744" stroke="url(#goldGrad)" stroke-width="2.5" />

    <!-- Stylized Civic Public Infrastructure Monument (Pillars & Dome) -->
    <!-- Dome / Pediment -->
    <path d="M -22 -6 L 0 -22 L 22 -6 Z" fill="url(#goldGrad)" />
    
    <!-- Arch beam -->
    <rect x="-22" y="-4" width="44" height="3" rx="1" fill="#FFFFFF" />

    <!-- 4 Civic Pillars (Public Works) -->
    <rect x="-19" y="1" width="5.5" height="20" rx="1.5" fill="#FFFFFF" opacity="0.95" />
    <rect x="-8.5" y="1" width="5.5" height="20" rx="1.5" fill="#FFFFFF" opacity="0.95" />
    <rect x="3" y="1" width="5.5" height="20" rx="1.5" fill="#FFFFFF" opacity="0.95" />
    <rect x="13.5" y="1" width="5.5" height="20" rx="1.5" fill="#FFFFFF" opacity="0.95" />

    <!-- Base Plinth -->
    <rect x="-24" y="22" width="48" height="4" rx="1.5" fill="#FFFFFF" />
    <rect x="-26" y="27" width="52" height="3" rx="1.5" fill="url(#goldGrad)" />

    <!-- Satellite / 360 Digital Beacon Pin (Top-Right) -->
    <circle cx="28" cy="-28" r="9" fill="#10B981" stroke="#05101D" stroke-width="2.5" />
    <circle cx="28" cy="-28" r="4" fill="#FFFFFF" />
  </g>
</svg>
