<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient: Deep Royal Indigo to Midnight Navy -->
    <linearGradient id="pwaBg512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2B48" />
      <stop offset="50%" stop-color="#0A1D33" />
      <stop offset="100%" stop-color="#05101D" />
    </linearGradient>

    <!-- Golden Saffron Glow Gradient -->
    <linearGradient id="goldGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Cyan Satellite Glow -->
    <linearGradient id="radarGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Subtle Shadow -->
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Full Background (Safe for Maskable Crop) -->
  <rect width="512" height="512" fill="url(#pwaBg512)" />

  <!-- Center Artwork - Strictly Inside 65% Safe-Zone to Prevent Android Mask Cut-Off -->
  <g transform="translate(256, 256)" filter="url(#glow512)">
    
    <!-- Outer 360 Radar Orbit Rings -->
    <circle cx="0" cy="0" r="130" fill="none" stroke="#38BDF8" stroke-width="4.5" stroke-dasharray="22 16" opacity="0.45" />
    <circle cx="0" cy="0" r="108" fill="#0D2744" stroke="url(#goldGrad512)" stroke-width="6.5" />

    <!-- Stylized Civic Public Infrastructure Monument (Pillars & Dome) -->
    <!-- Dome / Pediment -->
    <path d="M -60 -16 L 0 -58 L 60 -16 Z" fill="url(#goldGrad512)" />
    
    <!-- Arch beam -->
    <rect x="-60" y="-11" width="120" height="8" rx="2.5" fill="#FFFFFF" />

    <!-- 4 Civic Pillars (Public Works) -->
    <rect x="-52" y="2" width="15" height="54" rx="3.5" fill="#FFFFFF" opacity="0.95" />
    <rect x="-23" y="2" width="15" height="54" rx="3.5" fill="#FFFFFF" opacity="0.95" />
    <rect x="8" y="2" width="15" height="54" rx="3.5" fill="#FFFFFF" opacity="0.95" />
    <rect x="37" y="2" width="15" height="54" rx="3.5" fill="#FFFFFF" opacity="0.95" />

    <!-- Base Plinth -->
    <rect x="-64" y="58" width="128" height="11" rx="3.5" fill="#FFFFFF" />
    <rect x="-70" y="71" width="140" height="8" rx="3.5" fill="url(#goldGrad512)" />

    <!-- Satellite / 360 Digital Beacon Pin (Top-Right) -->
    <circle cx="76" cy="-76" r="24" fill="#10B981" stroke="#05101D" stroke-width="6" />
    <circle cx="76" cy="-76" r="11" fill="#FFFFFF" />
  </g>
</svg>
